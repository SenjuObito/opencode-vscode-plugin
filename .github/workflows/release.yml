name: Release

# Build & package the VS Code extension on every pushed tag (e.g. `v0.1.0`).
# Produces one .vsix per platform/architecture and publishes a GitHub Release
# whose body becomes the "What's New" content shown by the in-extension
# changelog dialog (it reads the GitHub Releases API).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, package & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git-log fallback in release notes

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # vsce requires `version` to match the tag so the .vsix and the
      # in-extension APP_VERSION (embedded into the webview at build time)
      # line up with the GitHub release.
      - name: Sync version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Read the extension id from package.json so the VSIX filename always
          # tracks `name`. vsce's -o flag overrides its default
          # "<name>-<version>.vsix", so a hardcoded name here silently goes
          # stale whenever the extension id is renamed.
          echo "extname=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          VERSION="$VERSION" node -e "const fs=require('fs');const p='package.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');console.log('package.json version ->',process.env.VERSION);"

      - name: Install root dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check (extension host)
        run: pnpm run check-types

      - name: Install & build webview
        run: |
          cd webview
          pnpm install --no-frozen-lockfile
          pnpm rebuild esbuild || true
          pnpm build
          cd ..

      # ai-bridge is an independent npm project; its deps must ship inside the
      # VSIX (the daemon does `import('@opencode-ai/sdk/v2')` at runtime).
      - name: Install ai-bridge runtime dependencies
        run: |
          cd ai-bridge
          npm install
          cd ..

      - name: Build extension host
        run: node esbuild.js --production

      - name: Extract release notes
        run: node tools/extract-release-notes.mjs "${{ steps.meta.outputs.version }}" release-notes.md

      # The extension is pure JavaScript everywhere (no native modules, no
      # platform binaries — ai-bridge's only runtime dep @opencode-ai/sdk is
      # pure JS too), so ONE universal VSIX installs on all platforms/arches.
      - name: Package universal VSIX
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          EXTNAME="${{ steps.meta.outputs.extname }}"
          echo "Packaging $EXTNAME v$VERSION"
          npx --yes @vscode/vsce@latest package --no-dependencies -o "$EXTNAME-$VERSION.vsix"

      # Guard against the packaging defect where ai-bridge/node_modules gets
      # stripped: if the daemon SDK is missing, fail loudly instead of shipping
      # a broken extension.
      - name: Verify daemon dependency is packaged
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          EXTNAME="${{ steps.meta.outputs.extname }}"
          unzip -l "$EXTNAME-$VERSION.vsix" | grep -q "ai-bridge/node_modules/@opencode-ai/sdk" \
            && echo "OK: @opencode-ai/sdk shipped in VSIX" \
            || { echo "ERROR: @opencode-ai/sdk missing from VSIX"; exit 1; }

      - name: Create / update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          ASSET="${{ steps.meta.outputs.extname }}-$VERSION.vsix"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading asset..."
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "OpenCode Buddy $TAG" \
              --notes-file release-notes.md
          fi

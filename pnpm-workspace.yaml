# pnpm 11: the old `onlyBuiltDependencies` key was REMOVED in v11 and replaced
# by `allowBuilds` (a package-name -> bool map). v11 also no longer reads these
# settings from package.json's `pnpm` field — only from this file.
#
# esbuild's postinstall downloads its platform binary; if it is blocked,
# `pnpm install` fails with ERR_PNPM_IGNORED_BUILDS and `node esbuild.js`
# breaks in CI. @swc/core (pulled in by the webview's react-swc plugin) is
# listed too so its build script is allowed when the webview is installed.
#
# `packages` is limited to the repo root so webview/ and ai-bridge/ are treated
# as standalone projects. Without this, the root workspace install hoists their
# dependencies and `cd webview && pnpm install` reports "Already up to date"
# without creating webview/node_modules, which breaks the webview `tsc` build
# (Cannot find type definition file for 'vite/client').
packages:
  - '.'

allowBuilds:
  esbuild: true
  "@swc/core": true

    <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="HzOxa1hp4Aibl8ngmXLrkn" />
    <!-- CSP: 'unsafe-inline' is required for script-src because Java/JCEF injects JS at runtime
         (sendToJava bridge, clipboard handler, font/language/theme config, console forwarding).
         style-src 'unsafe-inline' is needed for dynamically applied CSS variables and theme styles.
         TODO: Migrate to nonce-based CSP for stronger XSS protection. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: blob: https://cc-gui-font.local; connect-src 'self' https://api.github.com; frame-src 'none';" data-page-node-id="mBToZECZbhBRf0BEwMoiWG" />
    <title>OpenCode Buddy</title>
    <!-- 首帧底色：React 挂载前 body 是白的，暗色主题下会闪一下。
         跟随 VS Code 注入的主题变量，不写死颜色。 -->
    <style>
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        background: var(--vscode-sideBar-background, var(--vscode-editor-background, #1e1e1e));
        color: var(--vscode-foreground, #cccccc);
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      #boot-splash .boot-mark {
        width: 42px;
        height: 42px;
        opacity: 0.55;
        color: var(--vscode-foreground, #cccccc);
      }

      /* 环形微动效：只在用户没有要求减少动效时出现 */
      @media (prefers-reduced-motion: no-preference) {
        #boot-splash .boot-mark {
          animation: boot-spin 1.6s linear infinite;
        }
      }

      @keyframes boot-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <!-- Set theme data-theme attribute immediately before React loads -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var ideTheme = window.__INITIAL_IDE_THEME__;
          var theme;

          if (savedTheme === 'light' || savedTheme === 'dark') {
            // User's explicit theme selection takes priority
            theme = savedTheme;
          } else if (ideTheme === 'light' || ideTheme === 'dark') {
            // Follow IDE mode, using the theme injected by Java
            theme = ideTheme;
          } else {
            // Fallback (should not happen in theory, as Java always injects the theme)
            theme = 'dark';
          }

          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
